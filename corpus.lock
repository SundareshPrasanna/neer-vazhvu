{
  "_doc": [
    "Pins the private data repo commit that scripts/fetch-corpus.sh syncs into",
    "public/data + public/geojson when CORPUS_SOURCE=remote. With",
    "CORPUS_SOURCE unset or 'repo' this file is inert and the corpus comes",
    "from the git checkout. The data repo's toolchain.lock is the",
    "mirror-image pin in the other direction. Bump deliberately: deploys stay",
    "reproducible and rolling back the site rolls back the data.",
    "expected_files pins the per-root file counts at the locked commit - the",
    "fetch script refuses to sync a corpus that does not match them, so a",
    "missing or truncated root can never wipe the destination and report",
    "success.",
    "2026-08-19: corpus-2026-08-19-arkavathi-prs. Madhuri's review round - the",
    "Arkavathi 2025 stretch rebuilt from the canonical PRS layer at 109.1 km, the",
    "earlier epoch relabelled 2018 at 64.6 km, and the September 2025 MPR read so",
    "asOf values move forward a month. Seven files edited, none added or removed,",
    "so expected_files is unchanged at 497/114.",
    "2026-08-20: the 50 m measurement grid (data#26, squash 3dcf72a4e07eca7a8016e2ab3340afb6e21a1f44). Modification-only: 12 waterway artifacts re-synced from neer-vazhvu#296, no files added or removed, so expected_files stays 497/114 and this bump moves only the sha. Both waterway pages' transects and condition strips move to 50 m; methods sections ship per waterway in reaches.json.",
    "2026-08-20: the opener-title release (data#28, squash 6412b0bee3c3cafeda8cbc03bfc5d3e59e8667f3). Two chapters.json artifacts re-synced from neer-vazhvu#298; counts stay 497/114 - a sha-only bump. The canal's first line becomes 'From Ennore to Mahabalipuram, fifty metres at a time', the Cooum's 'From Satharai to the sea, fifty metres at a time'.",
    "2026-08-20: the locator-anchors + labelled-estimates release (data#30, squash 15d251bae82af2a850c59e4c3a0d0b07ad6f9657). Four waterway artifacts re-synced from neer-vazhvu#300 and #301; counts stay 497/114 - a sha-only bump. The canal strips carry 50 OFFSET + 241 calibration-gated spectral estimates; the Cooum ships none by the quality gate, stated in its methods.",
    "2026-08-20: the Surat release, city nine (data#19 then data#32, tagged corpus-2026-08-20-surat-r2 at 9bba13d1185039fbcc68c11df2f1f2401a2c0c46). The first bump since Pune that ADDS files: 510 under data/ and 116 under geojson/, up from 497/114. Surat's thirteen city artifacts plus the two-artifact industrial layer - GEMI's monitoring of both Surat CETPs against the discharge norms in each plant's own GPCB consent, which is what effluent fell back to after GPCB's live OCEMS turned out unreachable (TCP connects, TLS never completes) and CPCB's national API all-NA.",
    "PIN r2, NOT r1. corpus-2026-08-20-surat (r1) released the 19 Aug branch content, which predates the fixes the city needed: the commitments artifact that crashed the page, an incompatible cgwb-stations shape, a water-bodies layer 17 polygons short, and no gwr-blocks-surat.json at all. r1 is left in place rather than moved, per the no-moving-tags rule in the data repo's release doc; it is simply not what this file points at.",
    "SURAT IS NOT LIVE AT THIS COMMIT and this bump does not make it live: the city config still carries enabled:false, so its routes 404 outside preview until the cutover PR flips it.",
    "2026-08-20 (evening): the daily-feed refresh, tagged corpus-2026-08-20-refresh-r3 at 458dd447c17604afce914b2c236298fea2b1037a. Modification-only across three data PRs (#34, #35, #36): 18 artifacts, none added or removed, so expected_files stays 510/116. Surat's flood chain at its FIRST scheduled scrape - the daily job had been skipping the city because its guard checks for the scraper on main and #274 was unmerged - plus Pravah for Mumbai and Pune, BBMB for Delhi, Kolkata's waterlogging register, BMC's flood spots, the nine rainfall-recent files and both cauvery rainfall-deviation scoreboards. Pin r3: r1 missed mumbai-flood-hotspots.geojson (a .geojson under data/, which a *.json-only diff skipped) and r2 predates the last three feeds. Earlier tags are left in place rather than moved.",
    "THE SCRAPERS DO NOT REACH PRODUCTION ON THEIR OWN. Verified 2026-08-20 after a green deploy: the site served surat-flood-chain at 19 Aug and mmr-dam-storage at 17 Aug while main carried both at 20 Aug. Production builds with CORPUS_SOURCE=remote, so public/data on main is read by nothing and every artifact-backed feed is frozen at whatever this file pins - only the Supabase-backed reservoir cards are genuinely live. No workflow bumps this file, so a release has to follow every refresh by hand until one does.",
    "2026-08-20 (evening): the Gurugram rainfall release, tagged corpus-2026-08-20-gurugram-rainfall at a22d91ff5ce1447fcd01f3cb58cbd639ce2872d7. ADDS two artifacts, so expected_files moves 510/116 -> 512/116: imd-rainfall-monthly-gurugram.json (56 years at grid point 28.50/77.00) and rainfall-recent-gurugram.json (the Open-Meteo provisional fill on the same point). Gurugram was the last live city with no rainfall chart and the last entry in FRESHNESS_EXEMPTIONS, which is now empty. The data repo's toolchain.lock pins the gurugram-rainfall branch head meanwhile, because the source id imd-gridded-rainfall-gurugram is registered only there until #310 merges.",
    "2026-08-21: the Gurugram choropleth release, tagged corpus-2026-08-21-gurugram-choropleth at 5f40bbe75592a4bcf3e837955741a3d5b5b8fd00. ADDS two artifacts, so expected_files moves 512/116 -> 513/117: gurugram-gwr-blocks.geojson (six district boundaries joined to the IN-GRES assessment) and water-bodies-lost-gurugram.json. This is the release that makes the groundwater page colour - the values shipped weeks ago in gwr-blocks-gurugram.json, the shapes did not, so the map drew six polygons in the no-data grey. Also rebuilds gwr-blocks-gurugram with stage_of_extraction_pct across four assessment years, the supply overview, and the ten rainfall-recent files from this morning's scheduled run.",
    "2026-08-21: the Surat rivers + water-bodies correction, tagged corpus-2026-08-21-surat-rivers-wb-r2 at 2cd46019ca10cba4c1f6794dcbe4b53e27c77a40. Modification-only, 513/117 unchanged. The Tapi had been cut 48 km short of Ukai by an Overpass box drawn around the CITY (89.5 -> 211.0 km); the CPCB stations, whose coordinates are OURS because CPCB publishes none, were up to 48 km off the drawn river and now carry position_method=approximate and sit snapped to the centreline; and the water-bodies layer went 3,418 -> 805, clipped from a district-wide WETLAND atlas to SMC limits and inland bodies after it turned out to be claiming 351 sq km of water inside a 462 sq km city. PIN r2: r1 predates the same day's daily-feed catch-up and would have left production a day behind on Surat's flood chain, whose rolling history cannot be backfilled.",
    "2026-08-22: the Cauvery-KA snapshot + NWMP trends release, tagged corpus-2026-08-22-cauvery-ka-snapshot at 051cb616163281c0c85afadb740d69666bf46d5f (data#43 squash; counts verified against the tree API). ADDS 12 artifacts, so expected_files moves 513/117 -> 525/117: the five canonical 2025 stretch lines replacing the KWRIS-vintage blobs on the cauvery-ka overview (priorities + max BOD from the CPCB Oct-2025 report), named river centrelines + the full-basin context outline from Paani's Aug-2026 hydrology package, and ten CPCB annual BOD/DO/FC trend packs on the Kabini + Arkavathi NWMP stations, all L2-enveloped.",
    "2026-08-25: the Mumbai + Hyderabad deep-zoom release, tagged corpus-2026-08-25-deep-zoom-mumbai-hyderabad at ccb646642550a91294e0f11b5ff686358cf918db (data#48 squash; counts verified against the tree API). ADDS 80 artifacts, so expected_files moves 527/117 -> 587/137: ten flagship bodies joining the rich-body cohort, six data artifacts each (imagery manifest, JRC water trend, DW water extension, DW built trend, Open Buildings and Overture counts) plus a polygon and a 1 km buffer each. No new source ids and no new licence strings, so toolchain.lock stays put; its pin was re-checked with git merge-base --is-ancestor and the three corpus passes were reproduced against it locally before the data PR merged.",
    "THE CHIPS LIVE IN SUPABASE, AND THAT BUCKET HAD BEEN DELETED. The manifests this release adds reference satellite-evidence storage, not the corpus. On 2026-08-24 a valid service_role key returned GET /storage/v1/bucket -> 200 [], so every chip and tint URL in every ALREADY-SHIPPED manifest was 404ing and the deep-zoom imagery slider had been blank in production for all 21 earlier bodies. Nothing in CI catches it, because the manifests still hold well-formed URLs. Bucket recreated; these ten are serving; the 21 older bodies still need their chips regenerated.",
    "2026-08-25: the deep-zoom imagery restore, tagged corpus-2026-08-25-deep-zoom-imagery-restore at 4f73a7baf41d955dae07716d58b5a745521b7639 (data#49 squash). Modification-only: 21 imagery manifests, none added or removed, so expected_files stays 587/137 and this bump moves only the sha. This is the release that makes the deep-zoom slider work again for Chennai's seven bodies and Bengaluru's fourteen - their chip and tint URLs had been 404ing since the satellite-evidence bucket was deleted, with the manifests still holding well-formed URLs so no gate ever flagged it. The fourteen Bengaluru lakes carry tints for the first time. Verified by fetching all 860 chip and tint URLs, not by sampling.",
    "2026-08-26: the four-city deep-zoom release, tagged corpus-2026-08-26-deep-zoom-four-cities at 32634947876304454baba1edf180bb5d877cc659 (data#50 squash; counts verified against the tree API). ADDS 96 artifacts, so expected_files moves 587/137 -> 659/161: twelve flagship bodies for Delhi, Kolkata, Pune and Gurugram, six data artifacts plus a polygon and buffer each. All L2-enveloped by the new shared nvdm_envelope_rich_bodies.py, which derives scope from the rich-body registry instead of a fifth and sixth per-city copy of the same provenance block. Surat gets no body and Kolkata ships without the East Kolkata Wetlands; both absences are reasoned in those cities' data-sources docs rather than left silent.",
    "2026-08-26: the Kolkata scope.kind correction, tagged corpus-2026-08-26-kolkata-scope-fix at 65f5543f704504f91fc2ba977348e624ff955612 (data#51 squash). Modification-only across 24 files, so expected_files stays 659/161 and only the sha moves. The four-city release shipped Kolkata's artifacts as scope.kind 'city'; Kolkata is a region like MMR and the L2 gate rejected all twenty-four. Worth knowing for the next release: nvdm-l2-gate.sh runs ONLY on pull_request, so it is absent from a local preflight that otherwise looks complete - run it by hand against the merge-base.",
    "2026-08-28: the Paani Phase 3 release, tagged corpus-2026-08-28-cauvery-phase3 at 4aee6adcc93c2139a05843789f3c510870da4d23 (data#53 squash, after data#52 carried the Kerala context as first built; counts verified against the tree API). ADDS 6 artifacts, so expected_files moves 659/161 -> 665/161: the Kabini's full-watershed context outline and the Kerala reach above the state line (areaKm2 2,199, lengthKm 84.5, both roles reproduced by the ingest after the 28 Aug review), and the Cauvery-KA snapshot layers - state boundary, 25 India-WRIS waterbodies, Greater Bengaluru split by the divide (35.1% drains here), the Kabini above the basin. Also carries the Nanjangud register subtab on kabini/prs.json (345 consented / 217 operating), the review-fixed kabini flow-stations + inventories, and the daily feeds the scrapers pushed to code main since the 26 Aug release. The data repo's toolchain.lock was re-pinned to main 17c1e202 in the same release, so no dangling pins.",
    "2026-09-01: the Kabini after Madhuri's review, tagged corpus-2026-09-01-kabini-feedback at 636001a7863a8cf00f14e1a345afc26f664d6a3e (data#55 squash; counts verified against the tree API). ADDS 2 artifacts - the Kerala context waterbodies and the tributary skeleton that connects them to the river system - so expected_files moves 814/161 -> 816/161. Four modified: command-areas drops the K R Sagar command, inventory carries the two new families, and the two CWC readings packs carry the reworded chart captions.",
    "2026-09-02: the facts-quality release, tagged corpus-2026-09-02-facts-quality at 30f3a1d16c00802c4e07567e2fe5c15b405bef7b (data#59 squash; counts verified against the tree API). Modification-only: the five facts-*.json from neer-vazhvu#347 - 37 stale Live badges re-tiered across Delhi, Hyderabad, Kolkata, Surat and Pune, data_dates added so badges show their vintage, and Pune's flood-line fact corrected to the statewide register - none added or removed, so expected_files stays 1030/161 and this bump moves only the sha."
