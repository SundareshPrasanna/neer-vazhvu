{
  "_doc": [
    "Pins the private data repo commit that scripts/fetch-corpus.sh syncs into",
    "public/data + public/geojson when CORPUS_SOURCE=remote. With",
    "CORPUS_SOURCE unset or 'repo' this file is inert and the corpus comes",
    "from the git checkout. The data repo's toolchain.lock is the",
    "mirror-image pin in the other direction. Bump deliberately: deploys stay",
    "reproducible and rolling back the site rolls back the data.",
    "expected_files pins the per-root file counts at the locked commit - the",
    "fetch script refuses to sync a corpus that does not match them, so a",
    "missing or truncated root can never wipe the destination and report",
    "success.",
    "2026-08-19: corpus-2026-08-19-arkavathi-prs. Madhuri's review round - the",
    "Arkavathi 2025 stretch rebuilt from the canonical PRS layer at 109.1 km, the",
    "earlier epoch relabelled 2018 at 64.6 km, and the September 2025 MPR read so",
    "asOf values move forward a month. Seven files edited, none added or removed,",
    "so expected_files is unchanged at 497/114."
  ],
  "repo": "github.com/SundareshPrasanna/neer-vazhvu-data",
  "sha": "0d70b0771ee6cc57f5f164fad7beff5a2c1aff46",
  "expected_files": {
    "data": 497,
    "geojson": 114
  }
}
