{
  "_doc": [
    "Pins the private data repo commit that scripts/fetch-corpus.sh syncs into",
    "public/data + public/geojson when CORPUS_SOURCE=remote. With",
    "CORPUS_SOURCE unset or 'repo' this file is inert and the corpus comes",
    "from the git checkout. The data repo's toolchain.lock is the",
    "mirror-image pin in the other direction. Bump deliberately: deploys stay",
    "reproducible and rolling back the site rolls back the data.",
    "expected_files pins the per-root file counts at the locked commit - the",
    "fetch script refuses to sync a corpus that does not match them, so a",
    "missing or truncated root can never wipe the destination and report",
    "success.",
    "2026-08-18: the Pune release, corpus-2026-08-18-pune. 483 under data/ and",
    "114 under geojson/, up from 474 / 108. Adds 15 Pune artifacts and carries",
    "a Mumbai correction - mmr-dam-storage was rewritten because the Pravah",
    "parser had read today's GROSS storage as last year's LIVE, putting",
    "Modaksagar at 159% of live capacity (producer fixed in #275, residual DB",
    "rows tracked as #276).",
    "PUNE IS NOT LIVE AT THIS COMMIT and this bump does not make it live: the",
    "city config still carries enabled:false, so its routes 404 outside",
    "NEXT_PUBLIC_PREVIEW_CITIES. Shipping the corpus first is the intended",
    "order - the data lands, then the migrations, then the cutover.",
    "SUPERSEDES #284, which pinned the Kabini PRS release (cb50bb8, 474/108) on",
    "main while this branch was open. Not overwritten blindly - the 2026-08-17",
    "entry below is on record precisely because taking one side of a corpus.lock",
    "merge once rolled two live cities out. Checked first: cb50bb8 is the DIRECT",
    "PARENT of 825a87a7 in the data repo (the Pune merge is the only commit",
    "between them), so this pin contains everything #284's does. The counts",
    "reconcile exactly - 474+9 data and 108+6 geojson are the 15 Pune artifacts.",
    "For reference, 2026-08-17 pinned the Kabini release as a UNION of both sides",
    "of a main merge (474 data / 108 geojson), because neither side was right",
    "alone: main had no Kabini, the branch had no Kolkata or Gurugram.",
    "2026-08-19: the Buckingham Canal release. 490 under data/ and 114 under",
