[project]
name = "neer-vazhvu-api"
version = "0.1.0"
description = "Chennai Water Intelligence Service — scrapers, ETL, and forecasting"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "supabase>=2.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "statsforecast>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
