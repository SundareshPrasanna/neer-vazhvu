# Weekly refresh of Mumbai's flood-spot layer from BMC's own Disaster
# Management register (public API behind dm.mcgm.gov.in). The register is
# the officially mapped subset of the pre-monsoon flooding-spot list -
# names, wards, coordinates, linked rain gauges - and BMC revises it
# around the monsoon (spots added after washouts, e.g. 80 new mid-season
# in 2025), so a weekly pull keeps the flood page honest without hammering
# a civic API daily.
#
# Artifact-commit pattern (like pravah-dam-refresh.yml / imd-rainfall-
# refresh.yml): static file committed back to the branch, Vercel deploy
# picks it up. The scraper refuses to overwrite the layer when the API
# returns a partial register (<50 spots), so a flaky response can't wipe
# the map; a missed week just keeps the previous register.
name: BMC Flood-Spot Register Refresh

on:
  schedule:
    - cron: '30 4 * * 1'   # Mondays 04:30 UTC = 10:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stdlib-only scraper - no dependencies to install.
      - name: Fetch BMC flood-spot register
        working-directory: neer-vazhvu-api
        run: |
          for attempt in 1 2 3; do
            if python scripts/scrape_bmc_flood_spots.py; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          echo "BMC DM API unreachable/partial after 3 attempts; keeping last week's register"
          exit 0

      - name: Commit refreshed register
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/mumbai-flood-hotspots.geojson
          if git diff --staged --quiet; then
            echo "No register change to commit"
            exit 0
          fi
          git commit -m "BMC flood-spot register refresh ($(date -u +%Y-%m-%d))"
          git push
