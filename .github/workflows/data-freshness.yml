name: Data freshness check

# Daily staleness sweep across every city's ingested feeds - reservoir
# tables in Supabase, the provisional-rainfall artifacts, and the weekly
# city-specific artifacts. Checks are DERIVED from the city configs by
# scripts/check-data-freshness.ts, so a newly onboarded city is covered
# automatically (and CI's data:check gate fails if its feeds aren't
# checkable).
#
# Why this exists: individual scrape steps tolerate failures by design
# (continue-on-error / skipped bulletins), so job conclusions read
# "success" while data quietly ages - Chennai went 5 days stale behind
# green runs in July 2026. This workflow is the alarm that fires on the
# DATA, not the jobs.
#
# Runs after the morning pipelines (rainfall 02:45, Pravah 04:00, daily
# pipeline 04:51 UTC) so a healthy morning reads fresh.

on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC = 12:00 IST daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check data freshness
        id: freshness
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npx tsx scripts/check-data-freshness.ts --check

      - name: Alert on stale feeds
        # Always runs, including on success: a recovered feed leaves the
        # pipeline alert digest here (.github/workflows/lib/rolling-alert.js).
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { digest } = require('./.github/workflows/lib/rolling-alert.js');
            const alerts = fs.existsSync('freshness-alerts.json')
              ? JSON.parse(fs.readFileSync('freshness-alerts.json', 'utf-8'))
              : { items: [{ id: 'freshness-checker', level: 0, summary: 'The freshness checker did not finish; see the run log.' }],
                  scope: ['freshness-checker'] };
            await digest({
              github, context, channel: 'freshness', ...alerts,
              note: 'stale feeds, 12:00 IST daily; the full table is in the run summary. CMWSSB and Pravah '
                + 'both intermittently block GitHub runner IPs while answering residential IPs - running the '
                + 'scraper locally recovers the day (see neer-vazhvu-api/scripts/).',
            });

      - name: Add the full table to the run summary
        if: always()
        run: cat freshness-report.md >> "$GITHUB_STEP_SUMMARY" || true
