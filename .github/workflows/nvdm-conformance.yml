name: NVDM conformance

# Guards the machine-readable arm of the NVDM data-model standard
# (schemas/nvdm/ + the dataset catalogue). Three checks:
#   1. Validator selftest - the schemas and rules keep rejecting what they
#      must reject (including adversarial probes, gate selector and ratchet
#      regressions).
#   2. Catalogue, conformance-report and REFERENCE.md freshness - the committed
#      outputs match the tree (same pattern as the ward-profiles.json CI gate).
#      Regenerate in this order: python3 scripts/build_dataset_catalogue.py &&
#      python3 scripts/validate_nvdm.py && python3 scripts/build_nvdm_reference.py
#   3. scripts/nvdm-gate.sh on every changed data artifact - ENFORCING since
#      NVDM v1 acceptance (2026-07-30): a new artifact must reach L2, one at L2
#      or L3 must keep its level. Files below L2 stay report-only. See
#      schemas/nvdm/RULES.md Part 10 and schemas/nvdm/GUIDE.md.

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/data/**'
      - 'public/geojson/**'
      - 'schemas/nvdm/**'
      - 'scripts/build_dataset_catalogue.py'
      - 'scripts/validate_nvdm.py'
      - 'scripts/build_nvdm_reference.py'
      - 'scripts/nvdm_scopes.py'
      - 'scripts/nvdm-gate.sh'
      - 'scripts/source-registry/**'
      - 'src/lib/cities/data-paths.ts'
      - 'src/lib/water-bodies/rich-body-registry.ts'
      - 'src/lib/water-bodies/rich-bodies.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validator selftest
        run: python3 scripts/validate_nvdm.py --selftest

      - name: Catalogue freshness
        run: |
          python3 scripts/build_dataset_catalogue.py
          git diff --exit-code docs/architecture/dataset-catalogue.json docs/architecture/dataset-catalogue.md

      - name: Conformance report freshness
        run: |
          python3 scripts/validate_nvdm.py
          git diff --exit-code docs/architecture/nvdm-conformance.md

      - name: Reference freshness
        run: |
          python3 scripts/build_nvdm_reference.py
          git diff --exit-code schemas/nvdm/REFERENCE.md

      - name: NVDM gate on changed data artifacts (ENFORCING - NVDM v1 accepted 2026-07-30)
        if: github.event_name == 'pull_request'
        run: |
          if ! bash scripts/nvdm-gate.sh "${{ github.event.pull_request.base.sha }}"; then
            echo "::error title=NVDM gate::A new data artifact must reach L2 and one at L2 or L3 must keep its level. Find the message above in schemas/nvdm/GUIDE.md#the-gate-failed for its fix."
            exit 1
          fi
