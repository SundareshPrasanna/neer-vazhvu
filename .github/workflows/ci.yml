name: CI

# Serving-hardening D4 split (review addendum 2026-07-30): the FULL-corpus
# jobs validate against the complete corpus (today: from the checkout; after
# the P2 cutover: fetched via scripts/fetch-corpus.sh, which requires the
# CORPUS_REPO_TOKEN secret and therefore cannot run on fork PRs). The
# sample-corpus job needs no secrets and runs everywhere: it prunes the
# corpus to the clean reference set plus documented fixtures
# (scripts/sample-corpus.json) and proves build + tests pass against it.
# Job names say exactly what they check - there is deliberately NO silent
# fallback from full to sample.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend - full corpus from checkout (lint + build + tests + data checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Verify ward-profiles.json is up-to-date
        run: |
          npx tsx scripts/compute-ward-profiles.ts
          git diff --exit-code public/data/ward-profiles.json

      - name: Verify madurai-ward-profiles.json is up-to-date
        run: |
          npx tsx scripts/compute-madurai-ward-profiles.ts
          git diff --exit-code public/data/madurai-ward-profiles.json

      - name: Verify bangalore-ward-profiles.json is up-to-date
        run: |
          npx tsx scripts/compute-bangalore-ward-profiles.ts
          git diff --exit-code public/data/bangalore-ward-profiles.json

      - run: npm run data:check
      - run: npm run build
      - run: npm run test

  sample-corpus:
    name: Sample corpus - clean reference set + documented build fixtures, no secrets (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Encumbrance classifier + lineage selftest
        run: python3 scripts/nvdm-encumbrance-report.py --selftest

      - name: Reference set stays licence-clean; fixtures stay as documented
        run: python3 scripts/check-sample-corpus.py

      - name: Prune corpus to the sample manifest
        run: python3 scripts/check-sample-corpus.py --prune

      - name: Build against the sample corpus only
        run: npm run build

      - name: Tests against the sample corpus only
        run: npm run test

  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neer-vazhvu-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
