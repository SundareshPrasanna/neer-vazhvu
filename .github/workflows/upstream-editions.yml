name: Headwaters upstream editions

# Weekly edition-watch over episodic sources (registry:
# scripts/source-registry/). Detection only - data updates stay
# human-in-the-loop. Design notes: docs/specs/headwaters.md (local).

on:
  schedule:
    - cron: '30 5 * * 1'   # Mondays 05:30 UTC = 11:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  editions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check upstream editions
        id: editions
        continue-on-error: true
        run: npx tsx scripts/check-upstream-editions.ts --check

      - name: Alert on new editions / failed checks
        if: steps.editions.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const today = new Date().toISOString().slice(0, 10);
            const title = `Headwaters: upstream editions - ${today}`;
            const report = fs.existsSync('editions-report.md')
              ? fs.readFileSync('editions-report.md', 'utf-8')
              : 'editions-report.md missing - the detector itself errored; see the run log.';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'headwaters',
              state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['headwaters', 'edition-alert'],
                body: [
                  report,
                  '',
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Handling a NEW EDITION: run the refresh method listed above (data',
                  'updates are human-reviewed), then `--accept <id>` and commit the',
                  'registry. Handling a CHECK FAILURE: some sites block runner IPs but',
                  'work from residential IPs - retry locally before changing the entry.',
                  '',
                  'This issue is created once per run day while detections remain open.',
                ].join('\n'),
              });
            }
