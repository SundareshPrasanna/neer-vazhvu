name: Daily Data Pipeline

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 06:00 IST
  workflow_dispatch:
    inputs:
      force_monthly:
        description: 'Run monthly pipeline regardless of day'
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: neer-vazhvu-api
        run: pip install -e .

      # Scrape Chennai's CMWSSB lake-level page. CMWSSB may block some
      # datacenter IPs, so this step tolerates up to 4 days of stale data
      # before failing. Each city has its own primary-supply scraper step;
      # they run independently so one city failing doesn't block the others.
      - name: Scrape Chennai (CMWSSB) -> Supabase
        id: scrape
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CMWSSB_MAX_STALE_DAYS: '4'
        run: python scripts/scrape_cmwssb.py

      # Scrape TN Agri ARS for Madurai (Vaigai + Mullaperiyar/Periyar)
      # reservoirs. Single page fetch. Tolerates up to 4 days of stale data
      # before failing.
      - name: Scrape Madurai (TN PWD) -> Supabase
        id: scrape_tn_pwd
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TN_PWD_MAX_STALE_DAYS: '4'
        run: python scripts/scrape_tn_pwd_reservoirs.py

      # India-WRIS CGWB station readings for Madurai district (last 90 days).
      # Chennai's WRIS is fetched from the monthly orchestrator's run-monthly
      # endpoint; Madurai runs daily here so the live-station overlay on
      # /madurai/groundwater stays fresh. Tolerates failures - upstream
      # India-WRIS API has periodic outages.
      - name: Scrape WRIS groundwater (Madurai) -> Supabase
        id: scrape_wris_madurai
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MADURAI_WRIS_DAYS: '90'
        run: python scripts/scrape_wris_madurai.py

      # India-WRIS CGWB station readings for Bangalore Urban district
      # (last 90 days). 13-14 active telemetric stations (Cubbon Park,
      # Lalbagh, NIMHANS, IISc, Hebbal, Jayanagar, Yelahanka, Anekal, etc.).
      # No Karnataka State GW board records in WRIS - CGWB only.
      # Bangalore is disabled in the city registry as of this commit, so
      # nothing on the frontend reads these rows yet; we accumulate
      # history here so the IISc Outlook stress-ward map has live
      # verification data on day-one when /bangalore launches.
      # Tolerates failures - upstream India-WRIS API has periodic outages.
      - name: Scrape WRIS groundwater (Bangalore) -> Supabase
        id: scrape_wris_bangalore
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BANGALORE_WRIS_DAYS: '90'
        run: python scripts/scrape_wris_bangalore.py

      # Mumbai 7-lake daily storage comes from the Pravah workflow
      # (pravah-dam-refresh.yml) - the earlier third-party mirror feed died
      # (500s) and its scraper was retired in July 2026.

      # Best-effort call into the FastAPI orchestrator (Chennai-side ETL +
      # briefing + legacy v1 forecasts). Marked continue-on-error so a down
      # PYTHON_API_URL endpoint doesn't block the rest of the daily run -
      # past runs were timing out at the 15-min job limit when the
      # orchestrator was unreachable.
      #
      # Madurai + Bangalore forecasts are NOT dependent on this; their
      # standalone forecasters run as separate steps below. Chennai's
      # legacy v1 forecaster + briefing live behind this endpoint today;
      # when this fails Chennai's daily briefing surfaces yesterday's row
      # via the table's date-scoped query (page.tsx falls back to template).
      - name: Run post-scrape pipeline (ETL + intelligence)
        id: post_scrape
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.PYTHON_API_URL }}/pipeline/run-post-scrape" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --max-time 90 \
            --retry 1 --retry-delay 30

      # Standalone AutoARIMA forecasters for the v2 multi-city schema.
      # These don't need the FastAPI orchestrator - they fit AutoARIMA on
      # reservoir_daily_v2 and upsert into reservoir_forecast_v2 directly.
      # Run with a 2-year history window for tractable wall clock (~10s
      # per city) and so seasonal AutoARIMA can pick up at least 2 yearly
      # cycles. Each marked continue-on-error so one city's failure
      # doesn't cascade.
      - name: Forecast Madurai reservoirs (AutoARIMA v2)
        id: forecast_madurai
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/compute_reservoir_forecast_madurai.py --history-days 730

      - name: Forecast Bangalore reservoirs (AutoARIMA v2)
        id: forecast_bangalore
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/compute_reservoir_forecast_bangalore.py --history-days 730

      # Generate AI city narrative (skips IST days 1-3; monthly job owns those)
      # Also skips when force_monthly is true to avoid race with monthly job
      - name: Generate AI city narrative
        if: inputs.force_monthly != true
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and run daily narrative
        if: inputs.force_monthly != true
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npx tsx scripts/generate-narratives.ts

      - name: Alert on scrape failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CMWSSB scrape failed - ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-alert',
              state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['pipeline-alert'],
                body: [
                  '## CMWSSB Scrape Failure',
                  '',
                  'The daily CMWSSB reservoir data scrape failed after all retry attempts.',
                  'Post-scrape intelligence ran with existing data. Forecasts and briefings are still current.',
                  '',
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Common causes:',
                  '- CMWSSB website is down for maintenance',
                  '- GitHub runner IP temporarily blocked',
                  '- CMWSSB changed their HTML page structure',
                  '',
                  'This issue will be created once per day. Close it after investigating.',
                ].join('\n'),
              });
            }

  # Monthly job runs on days 1-3 for groundwater + risk scoring + ward narratives
  monthly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Check if day 1-3 of month (IST)
        id: check-day
        run: |
          if [ "${{ inputs.force_monthly }}" = "true" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            DAY=$(TZ=Asia/Kolkata date +%d)
            if [ "$DAY" -le 3 ]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          fi

      # Best-effort call into the FastAPI orchestrator. continue-on-error
      # already set; tightened max-time + dropped retries so the step
      # fails fast (~30s) instead of blocking the job up to the timeout
      # when PYTHON_API_URL is unreachable.
      - name: Run Monthly Pipeline (groundwater + risk scoring)
        if: steps.check-day.outputs.run == 'true'
        continue-on-error: true
        run: |
          curl -X POST "${{ secrets.PYTHON_API_URL }}/pipeline/run-monthly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --max-time 30 \
            --retry 0

      # Generate AI ward + city narratives (monthly)
      - name: Set up Node.js
        if: steps.check-day.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and run monthly narratives
        if: steps.check-day.outputs.run == 'true'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npx tsx scripts/generate-narratives.ts --monthly
