name: Daily Data Pipeline

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 06:00 IST
  workflow_dispatch:         # Manual trigger for debugging

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: neer-vazhvu-api
        run: pip install -e .

      # Scrape runs here (GitHub runner IPs) because the deployed API server's
      # IP is blocked by the CMWSSB website, causing 30-second timeouts.
      - name: Scrape CMWSSB → Supabase
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/scrape_cmwssb.py

      - name: Run post-scrape pipeline (ETL + intelligence)
        run: |
          curl -X POST "${{ secrets.PYTHON_API_URL }}/pipeline/run-post-scrape" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --max-time 300 \
            --retry 2 --retry-delay 120

  # Monthly job runs on days 1-3 for groundwater + risk scoring
  monthly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule == '30 0 * * *' && (github.event_name == 'schedule')
    steps:
      - name: Check if day 1-3 of month
        id: check-day
        run: |
          DAY=$(date +%d)
          if [ "$DAY" -le 3 ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Monthly Pipeline (groundwater + risk scoring)
        if: steps.check-day.outputs.run == 'true'
        run: |
          curl -X POST "${{ secrets.PYTHON_API_URL }}/pipeline/run-monthly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --max-time 120 \
            --retry 2 --retry-delay 60
