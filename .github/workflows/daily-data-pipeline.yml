name: Daily Data Pipeline

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC = 06:00 IST
  workflow_dispatch:
    inputs:
      force_monthly:
        description: 'Run monthly pipeline regardless of day'
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        working-directory: neer-vazhvu-api
        run: pip install -e .

      # Scrape CMWSSB reservoir data. CMWSSB may block some datacenter IPs,
      # so this step tolerates up to 4 days of stale data before failing.
      - name: Scrape CMWSSB -> Supabase
        id: scrape
        continue-on-error: true
        working-directory: neer-vazhvu-api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CMWSSB_MAX_STALE_DAYS: '4'
        run: python scripts/scrape_cmwssb.py

      # Always run ETL + intelligence so forecasts and briefings stay fresh,
      # even when the scrape fails and we're using slightly stale reservoir data.
      - name: Run post-scrape pipeline (ETL + intelligence)
        run: |
          curl -X POST "${{ secrets.PYTHON_API_URL }}/pipeline/run-post-scrape" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --max-time 300 \
            --retry 2 --retry-delay 120

      # Generate AI city narrative (skips IST days 1-3; monthly job owns those)
      # Also skips when force_monthly is true to avoid race with monthly job
      - name: Generate AI city narrative
        if: inputs.force_monthly != true
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install and run daily narrative
        if: inputs.force_monthly != true
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npx tsx scripts/generate-narratives.ts

      - name: Alert on scrape failure
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CMWSSB scrape failed - ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'pipeline-alert',
              state: 'open',
            });
            const existing = issues.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['pipeline-alert'],
                body: [
                  '## CMWSSB Scrape Failure',
                  '',
                  'The daily CMWSSB reservoir data scrape failed after all retry attempts.',
                  'Post-scrape intelligence ran with existing data. Forecasts and briefings are still current.',
                  '',
                  `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  '',
                  'Common causes:',
                  '- CMWSSB website is down for maintenance',
                  '- GitHub runner IP temporarily blocked',
                  '- CMWSSB changed their HTML page structure',
                  '',
                  'This issue will be created once per day. Close it after investigating.',
                ].join('\n'),
              });
            }

  # Monthly job runs on days 1-3 for groundwater + risk scoring + ward narratives
  monthly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Check if day 1-3 of month (IST)
        id: check-day
        run: |
          if [ "${{ inputs.force_monthly }}" = "true" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            DAY=$(TZ=Asia/Kolkata date +%d)
            if [ "$DAY" -le 3 ]; then
              echo "run=true" >> $GITHUB_OUTPUT
            else
              echo "run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run Monthly Pipeline (groundwater + risk scoring)
        if: steps.check-day.outputs.run == 'true'
        run: |
          curl -X POST "${{ secrets.PYTHON_API_URL }}/pipeline/run-monthly" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --max-time 120 \
            --retry 2 --retry-delay 60

      # Generate AI ward + city narratives (monthly)
      - name: Set up Node.js
        if: steps.check-day.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and run monthly narratives
        if: steps.check-day.outputs.run == 'true'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npx tsx scripts/generate-narratives.ts --monthly
